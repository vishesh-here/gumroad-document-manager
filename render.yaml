services:
  - type: web
    name: gumroad-document-manager-api
    env: node
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 9000

  - type: static-site
    name: gumroad-document-manager-client
    buildCommand: cd client && npm install && npm run build
    publishDir: client/build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: gumroad-document-manager-api
          envVarKey: RENDER_EXTERNAL_URL 